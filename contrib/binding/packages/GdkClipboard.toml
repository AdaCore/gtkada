# ============================================================
#   GdkClipboard
# ============================================================

[[method]]
id = "gdk_clipboard_read_async"

[[method.parameter]]
name = "callback"
allow_none = "0"
# GDK requires a callback despite the GIR's allow-none annotation.

[[method]]
id = "gdk_clipboard_read_value_finish"
return = "Glib.Values.GValue_Const_Access"
# Returns a borrowed const GValue*, not a GValue record by value.
# A library-level access type can safely pass through the error wrapper.

[method.doc]
extend = true
text = "The returned value is borrowed; do not unset or free it."

[[method]]
id = "gdk_clipboard_set_valist"
bind = false
# varargs API

[[extra.with_body]]
pkg = "System"
use = false
