[doc]
group = "Dialogs"

[[parameter]]
name = "self"
ada  = "Self"

# gtk_color_dialog_choose_rgba_finish returns a newly allocated GdkRGBA*
# (transfer full), or NULL when the dialog was dismissed. The default
# binding maps it by value, which reads garbage; bind the pointer ABI by
# hand instead.
#
# The C function is
#   GdkRGBA *gtk_color_dialog_choose_rgba_finish
#     (GtkColorDialog *self, GAsyncResult *result, GError **error);
# The GError** out-parameter is mandatory: on a dismissed dialog (e.g.
# the window is destroyed) GTK reports the cancellation through it with
# g_propagate_error. Omitting it lets g_propagate_error write through an
# uninitialised pointer, segfaulting; so we must pass a real GError**.
[[method]]
id   = "gtk_color_dialog_choose_rgba_finish"
body = '''
      use type Glib.Error.GError;
      function Internal
         (Self   : System.Address;
          Result : Glib.G_Async_Result;
          Error  : access Glib.Error.GError) return access Gdk.RGBA.Gdk_RGBA;
      pragma Import (C, Internal, "gtk_color_dialog_choose_rgba_finish");
      --  gtk_color_dialog_choose_rgba_finish returns a newly allocated
      --  GdkRGBA* (transfer full), or NULL when the dialog was dismissed,
      --  in which case it sets Error.
      Error : aliased Glib.Error.GError := null;
      Color : constant access Gdk.RGBA.Gdk_RGBA :=
        Internal (Get_Object (Self), Result, Error'Access);
   begin
      if Color = null then
         --  Dismissed (or failed): free any reported error and report no
         --  colour. The caller treats Null_RGBA as "no colour chosen".
         if Error /= null then
            Glib.Error.Error_Free (Error);
         end if;
         return Gdk.RGBA.Null_RGBA;
      end if;
      return Gdk.RGBA.From_Object_Free (Color);
'''

[[extra.with_body]]
pkg = "Glib.Error"
use = false
