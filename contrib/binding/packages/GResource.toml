# ============================================================
#   GResource
# ============================================================
ada = "Glib.Resource"

[[enum]]
ctype = "GResourceLookupFlags"
ada = "Resource_Lookup_Flags"

[[method]]
id = "g_resources_register"
ada = "Register"

[[method]]
id = "g_resources_unregister"
ada = "Unregister"

# Open_Stream converts its result with Get_User_Data. GResource is a boxed
# type, so the spec does not with Glib.Object; without this the name is
# hidden by the homograph Glib.Main.Get_User_Data, which the spec's "use
# Glib.Input_Stream" drags into scope.
[[extra.with_body]]
pkg = "Glib.Object"
