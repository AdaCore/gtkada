[[virtual_method.parameter]]
name = "attribute_names"
direction = "access"

[[virtual_method.parameter]]
name = "attribute_values"
direction = "access"

[[virtual_method]]
id = "get_selection"

[[virtual_method.parameter]]
name = "ranges"
direction = "access"
