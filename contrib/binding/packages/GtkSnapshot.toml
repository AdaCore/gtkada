# ============================================================
#   GtkSnapshot
# ============================================================
#
# Graphene and GSK path fill/stroke APIs are bound. Other GSK node types
# remain suppressed below until their dependencies are bound.

# The parent (Gdk.Snapshot) lives in a different .gir file, so the
# generator cannot resolve its Ada name on its own and emits a bare,
# unqualified `Snapshot_Record`. Spell out the fully-qualified parent so
# the derivation and the `with Gdk.Snapshot` clause are generated.
parent = "Gdk.Snapshot.Gdk_Snapshot"

# --- not directly available ----------------------------------------
# For next methods the documentation says:
# This method is not directly available to language bindings.

[[extra.type]]
text = '''
   
   type Gfloat_Array4 is array (1 .. 4) of Gfloat;
   pragma Convention (C, Gfloat_Array4);

   type Gdk_Rgba_Array4 is array (1 .. 4) of Gdk.RGBA.Gdk_RGBA;
   pragma Convention (C, Gdk_Rgba_Array4);
'''

[[method]]
id   = "gtk_snapshot_free_to_node"
bind = false

[[method]]
id   = "gtk_snapshot_free_to_paintable"
bind = false

[[method]]
id = "gtk_snapshot_append_border"

[[method.parameter]]
name = "border_width"
type = "Gfloat_Array4"

[[method.parameter]]
name = "border_color"
type = "Gdk_Rgba_Array4"

[[method]]
id = "gtk_snapshot_append_conic_gradient"
body = '''
      procedure Internal
         (Self     : System.Address;
          Bounds   : not null access Graphene.Rect.Graphene_Rect_T;
          Center   : not null access Graphene.Point.Graphene_Point_T;
          Rotation : Interfaces.C.C_float;
          Stops    : System.Address;
          N_Stops  : Gsize);
      pragma Import (C, Internal, "gtk_snapshot_append_conic_gradient");
   begin
      Internal (Get_Object (Self), Bounds, Center, Rotation, Stops'Address, Gsize (Stops'Length));
'''

[[method.parameter]]
name = "stops"
type = "Gsk.Render_Node.Gsk_Color_Stop_Array"

[[method.parameter]]
name = "n_stops"
ada = ""

