# ============================================================
#   GtkSnapshot
# ============================================================
#
# Graphene is bound in full, so every subprogram whose types come from
# Graphene, Gdk.RGBA, Gdk.Texture, Pango, Cairo or the plain scalar types
# is bound here. What remains suppressed with `bind = false` is the
# Gsk-dependent set: Gsk is not bound at all (there is no
# contrib/Gsk-4.0.gir), so anything that transitively needs a Gsk render
# node, transform, path or enum stays out until that binding exists. A
# handful of deprecated CSS render helpers are additionally suppressed
# because Gtk.Style_Context is not bound, and two entry points are
# suppressed because GTK documents them as unavailable to language
# bindings.

# The parent (Gdk.Snapshot) lives in a different .gir file, so the
# generator cannot resolve its Ada name on its own and emits a bare,
# unqualified `Snapshot_Record`. Spell out the fully-qualified parent so
# the derivation and the `with Gdk.Snapshot` clause are generated.
parent = "Gdk.Snapshot.Gdk_Snapshot"

# --- Gradient nodes: need Gsk.ColorStop -----------------------------------
[[method]]
id   = "gtk_snapshot_append_conic_gradient"
bind = false  # needs Gsk.ColorStop

[[method]]
id   = "gtk_snapshot_append_linear_gradient"
bind = false  # needs Gsk.ColorStop

[[method]]
id   = "gtk_snapshot_append_radial_gradient"
bind = false  # needs Gsk.ColorStop

[[method]]
id   = "gtk_snapshot_append_repeating_linear_gradient"
bind = false  # needs Gsk.ColorStop

[[method]]
id   = "gtk_snapshot_append_repeating_radial_gradient"
bind = false  # needs Gsk.ColorStop

# --- Border / shadow nodes: need Gsk.RoundedRect --------------------------
[[method]]
id   = "gtk_snapshot_append_border"
bind = false  # needs Gsk.RoundedRect

[[method]]
id   = "gtk_snapshot_append_inset_shadow"
bind = false  # needs Gsk.RoundedRect

[[method]]
id   = "gtk_snapshot_append_outset_shadow"
bind = false  # needs Gsk.RoundedRect

# --- Path fill / stroke: need Gsk.Path, Gsk.FillRule, Gsk.Stroke ----------
[[method]]
id   = "gtk_snapshot_append_fill"
bind = false  # needs Gsk.Path / Gsk.FillRule

[[method]]
id   = "gtk_snapshot_append_stroke"
bind = false  # needs Gsk.Path / Gsk.Stroke

[[method]]
id   = "gtk_snapshot_push_fill"
bind = false  # needs Gsk.Path / Gsk.FillRule

[[method]]
id   = "gtk_snapshot_push_stroke"
bind = false  # needs Gsk.Path / Gsk.Stroke

# --- Render-node returns: need Gsk.RenderNode -----------------------------
[[method]]
id   = "gtk_snapshot_append_node"
bind = false  # needs Gsk.RenderNode

[[method]]
id   = "gtk_snapshot_to_node"
bind = false  # returns Gsk.RenderNode

[[method]]
id   = "gtk_snapshot_transform"
bind = false  # needs Gsk.Transform

# --- Scaled texture: needs Gsk.ScalingFilter ------------------------------
[[method]]
id   = "gtk_snapshot_append_scaled_texture"
bind = false  # needs Gsk.ScalingFilter

# --- Clip / blend / mask / composite pushes: need Gsk enums & types -------
[[method]]
id   = "gtk_snapshot_push_rounded_clip"
bind = false  # needs Gsk.RoundedRect

[[method]]
id   = "gtk_snapshot_push_blend"
bind = false  # needs Gsk.BlendMode

[[method]]
id   = "gtk_snapshot_push_mask"
bind = false  # needs Gsk.MaskMode

[[method]]
id   = "gtk_snapshot_push_composite"
bind = false  # needs Gsk.PorterDuff

[[method]]
id   = "gtk_snapshot_push_isolation"
bind = false  # needs Gsk.Isolation

[[method]]
id   = "gtk_snapshot_push_component_transfer"
bind = false  # needs Gsk.ComponentTransfer

[[method]]
id   = "gtk_snapshot_push_shadow"
bind = false  # needs Gsk.Shadow

[[method]]
id   = "gtk_snapshot_push_gl_shader"
bind = false  # needs Gsk.GLShader

# --- Deprecated CSS render helpers: need Gtk.Style_Context ----------------
# Gtk.Style_Context is not bound in the gtk4 tree ("--Gtk.StyleContext" in
# data.py), and these entry points are obsolescent (deprecated since 4.10)
# in any case.
[[method]]
id   = "gtk_snapshot_render_background"
bind = false  # needs Gtk.Style_Context (unbound, deprecated)

[[method]]
id   = "gtk_snapshot_render_focus"
bind = false  # needs Gtk.Style_Context (unbound, deprecated)

[[method]]
id   = "gtk_snapshot_render_frame"
bind = false  # needs Gtk.Style_Context (unbound, deprecated)

[[method]]
id   = "gtk_snapshot_render_insertion_cursor"
bind = false  # needs Gtk.Style_Context (unbound, deprecated)

[[method]]
id   = "gtk_snapshot_render_layout"
bind = false  # needs Gtk.Style_Context (unbound, deprecated)

# --- not directly available ----------------------------------------
# For next methods the documentation says:
# This method is not directly available to language bindings.

[[method]]
id   = "gtk_snapshot_free_to_node"
bind = false

[[method]]
id   = "gtk_snapshot_free_to_paintable"
bind = false
