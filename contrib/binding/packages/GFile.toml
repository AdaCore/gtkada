# ============================================================
#   GFile
# ============================================================

ada = "Glib.GFile"

[doc]
text = '''
A Glib.GFile.Gfile is an interface value, not a tagged object, so it cannot
be unreferenced directly. All the constructors below transfer ownership to
the caller; release the file with

   Glib.Object.Unref (Glib.Types.To_Object (File));

'''

# GFile is the interface a filesystem back-end implements. No Ada program
# does, so none of the 94 vtable slots is worth an access-to-subprogram type
# plus a trampoline in src/misc_generated.c.
[[virtual_method]]
id = "*"
bind = false

[[enum]]
ctype = "GFileQueryInfoFlags"

[[enum]]
ctype = "GFileCreateFlags"

[[enum]]
ctype = "GFileCopyFlags"

