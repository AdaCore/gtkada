# --- GAppInfo is only bound as an opaque proxy -------------------------
[[method]]
id = "g_file_query_default_handler"
bind = false
# Needs GApp_Info

[[method]]
id = "g_file_query_default_handler_async"
bind = false
# Needs GApp_Info

[[method]]
id = "g_file_query_default_handler_finish"
bind = false
# Needs GApp_Info

# --- the generator cannot return a C-allocated guint8 array ------------
# The "contents" output is a transfer-full array whose length comes back in
# a separate parameter; convert_from_c sends the generator down the
# Gdk.Clipboard path and it emits references to Atom_Arrays and N_Atoms.
[[method]]
id = "g_file_load_contents"
bind = false

[[method]]
id = "g_file_load_contents_async"
bind = false

[[method]]
id = "g_file_load_contents_finish"
bind = false

# --- redundant explicit array length ------------------------------------
# A Guint8_Array knows its own length, so drop "length" from the Ada profile
# and compute it, as Glib.Input_Stream.Read does with its "count".
[[method]]
id = "g_file_replace_contents"

[[method.parameter]]
name = "length"
ada = ""
default = "Contents'Length"

[[method]]
id = "g_file_replace_contents_async"

[[method.parameter]]
name = "length"
ada = ""
default = "Contents'Length"

# --- single out string mistyped as an array of strings ------------------
# GIR spells the "etag_out" of the load_bytes family "gchar**" where the rest
# of GFile spells it "char**", and the generator reads "gchar**" as a
# NULL-terminated array of strings. Naming the pointed-to type instead gives
# the "access UTF8_String" that g_file_replace_contents already uses for the
# very same etag.
[[method]]
id = "g_file_load_bytes"

[[method.parameter]]
name = "etag_out"
ctype = "gchar*"

[[method]]
id = "g_file_load_bytes_finish"

[[method.parameter]]
name = "etag_out"
ctype = "gchar*"

# --- bound by hand below -----------------------------------------------
# GIR declares the instance parameter of g_file_hash as a gconstpointer, and
# the generator honours it: the profile would take a System.Address. The
# type of an instance parameter cannot be overridden from the TOML, so bind
# the function by hand.
[[method]]
id = "g_file_hash"
bind = false

[[extra.spec]]
text = '''
   function Hash (Self : Gfile) return Guint;
   pragma Import (C, Hash, "g_file_hash");
   --  Creates a hash value for a Glib.GFile.Gfile. Two files that are Equal
   --  have the same hash.
   --
   --  This call does no blocking I/O.
   --
   --  @return 0 if Self is not a valid Glib.GFile.Gfile, otherwise an
   --  integer that can be used as a hash value for it.
'''
