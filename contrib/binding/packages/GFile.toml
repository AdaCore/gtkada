bind = false
# Needs GFile_Enumerator

[[method]]
id = "g_file_enumerate_children_async"
bind = false
# Needs GFile_Enumerator

[[method]]
id = "g_file_enumerate_children_finish"
bind = false
# Needs GFile_Enumerator

# --- needs GFileMeasureProgressCallback --------------------------------
[[method]]
id = "g_file_measure_disk_usage"
bind = false
# Needs GFile_Measure_Progress_Callback

[[method]]
id = "g_file_measure_disk_usage_async"
bind = false
# Needs GFile_Measure_Progress_Callback

[[method]]
id = "g_file_measure_disk_usage_finish"
bind = false
# Needs GFile_Measure_Progress_Callback, see g_file_measure_disk_usage

# --- needs GFileAttributeInfoList --------------------------------------
[[method]]
id = "g_file_query_settable_attributes"
bind = false
# Needs GFile_Attribute_Info_List

[[method]]
id = "g_file_query_writable_namespaces"
bind = false
# Needs GFile_Attribute_Info_List

