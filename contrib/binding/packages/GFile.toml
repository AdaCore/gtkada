# ============================================================
#   GFile
# ============================================================

ada = "Glib.GFile"

[doc]
gtkada_demo = "create_data_lists.adb"
text = '''
A Glib.GFile.Gfile is an interface value, not a tagged object, so it cannot
be unreferenced directly. All the constructors below transfer ownership to
the caller; release the file with

   Glib.Object.Unref (Glib.Types.To_Object (File));

'''

[[extra.with_spec]]
pkg = "Glib.File_Monitors"
limited = true

[[extra.with_spec]]
pkg = "Glib.GMounts"
limited = true

[[extra.with_body]]
pkg = "Glib.File_Monitors"

[[extra.with_body]]
pkg = "Glib.GMounts"

# GFile is the interface a filesystem back-end implements. No Ada program
# does, so none of the 94 vtable slots is worth an access-to-subprogram type
# plus a trampoline in src/misc_generated.c.
[[virtual_method]]
id = "*"
bind = false

[[enum]]
ctype = "GFileQueryInfoFlags"

[[enum]]
ctype = "GFileCreateFlags"

[[enum]]
ctype = "GFileCopyFlags"

[[extra.type]]
text = '''

   type GFile_Array is array (Positive range <>) of GFile;
   pragma Convention (C, GFile_Array);
'''

# --- lists of GFile ----------------------------------------------------
# GLib hands out both flavours: a GList* of GFile in
# g_app_info_launch / g_app_launch_context_*, and a GSList* of GFile in
# gdk_file_list_get_files / gdk_file_list_new_from_list.
[[list]]
ctype = "GFile"
ada   = "Gfile_List"

[[slist]]
ctype = "GFile"
ada   = "Gfile_SList"

[[method]]
id = "g_file_eject_mountable"
bind = false # Obsolescent

[[method]]
id = "g_file_eject_mountable_finish"
bind = false # Obsolescent

[[method]]
id = "g_file_unmount_mountable"
bind = false # Obsolescent

[[method]]
id = "g_file_unmount_mountable_finish"
bind = false # Obsolescent

[[method]]
id = "g_file_poll_mountable"

[method.doc]
extend = true
text = "Use poll_mountable_finish to get the result of the operation."

[[method]]
id = "g_file_start_mountable"

[method.doc]
extend = true
text = "Use start_mountable_finish to get the result of the operation."

[[method]]
id = "g_file_unmount_mountable_with_operation"

[method.doc]
extend = true
text = "Use unmount_mountable_with_operation_finish to get the result of the operation."

# --- varargs -----------------------------------------------------------
[[method]]
id = "g_file_new_build_filename"
bind = false
# varargs

