# ============================================================
#   GFileInfo
# ============================================================

ada = "Glib.File_Info"

# GFileType lives here rather than in Glib.GFile: Glib.GFile already withs
# Glib.File_Info for Query_Info, so the other direction would close a
# circular spec dependency.
[[enum]]
ctype = "GFileType"

[[list]]
ctype = "GFileInfo"
ada   = "File_Info_List"

[[method]]
id = "g_file_info_set_attribute_mask"
bind = false
# Needs Attribute_Matcher

# -----------------------

[[method]]
id = "g_file_info_get_modification_time"
bind = false
# Needs GTimeVal, deprecated

[[method]]
id = "g_file_info_set_modification_time"
bind = false
# Needs GTimeVal, deprecated

[[method]]
id = "g_file_info_get_size"
return = "Glib.Gint64" # override return type: goffset

[[method]]
id = "g_file_info_set_size"

[[method.parameter]]
name = "size"
type = "Glib.Gint64"
