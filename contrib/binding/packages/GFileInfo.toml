# ============================================================
#   GFileInfo
# ============================================================

ada = "Glib.File_Info"

# GFileType lives here rather than in Glib.GFile: Glib.GFile already withs
# Glib.File_Info for Query_Info, so the other direction would close a
# circular spec dependency.
[[enum]]
ctype = "GFileType"

[[method]]
id = "g_file_info_set_attribute_mask"
bind = false
# Needs Attribute_Matcher

