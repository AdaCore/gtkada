into = "PangoAttribute"

[[method]]
id = "pango_attr_list_get_iterator"
body = '''
      function Internal
         (Self : System.Address) return System.Address;
      pragma Import (C, Internal, "pango_attr_list_get_iterator");
      Result : Pango_Attr_Iterator;
   begin
      Result := Pango_Attr_Iterator'
        (To_Proxy (Internal (Get_Object (Self))));
      return Result;
'''

[[method]]
id = "pango_attr_list_get_type"
ada = "Get_Type_Attr_List"

[[method]]
id = "pango_attr_list_get_attributes"
bind = false

