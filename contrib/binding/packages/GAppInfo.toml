# ============================================================
#   GAppInfo
# ============================================================
ada = "Glib.App_Info"

[[extra.with_spec]]
pkg = "Glib.App_Launch_Context"
limited = true

[[extra.with_body]]
pkg = "Glib.App_Launch_Context"
use = true

[[list]]
ctype = "GAppInfo"
ada   = "App_Info_List"

[[enum]]
ctype = "GAppInfoCreateFlags"
ada = "Create_Flags"

[[method]]
id = "g_app_info_launch"

[[method.parameter]]
name = "files"
ctype = "GFileList"


[[method]]
id = "g_app_info_launch_uris"

[[method.parameter]]
name = "uris"
ctype = "StringList"

[[method]]
id = "g_app_info_launch_uris_async"

[[method.parameter]]
name = "uris"
ctype = "StringList"

[[method]]
id = "g_app_info_get_all"
return = "GAppInfoList"

[[method]]
id = "g_app_info_get_all_for_type"
return = "GAppInfoList"

[[method]]
id = "g_app_info_get_fallback_for_type"
return = "GAppInfoList"

[[method]]
id = "g_app_info_get_recommended_for_type"
return = "GAppInfoList"

[[method]]
id = "g_app_info_get_supported_types"

[method.doc]
text = '''
Retrieves the list of content types that App_Info claims to support.
If this information is not provided by the environment, returns an empty
list. Only types exported directly by the application are included, not
associations added with Glib.App_Info.Add_Supports_Type.

The caller must free each string in the list with GNAT.Strings.Free.
'''

[[virtual_method]]
id = "launch"

[[virtual_method.parameter]]
name = "files"
ctype = "GFileList"

[[virtual_method]]
id = "launch_uris"

[[virtual_method.parameter]]
name = "uris"
ctype = "StringList"

[[virtual_method]]
id = "launch_uris_async"

[[virtual_method.parameter]]
name = "uris"
ctype = "StringList"

[doc]
group = "GIO"
gtkada_demo = "create_data_lists.adb"
