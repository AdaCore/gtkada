# ============================================================
#   ErrorEnums
# ============================================================
# A home for GLib's error-domain enumerations, on the model of GtkEnums and
# PangoEnums. GFileError is a GLib domain rather than a GIO one -- GtkBuilder,
# GBytes and GResource all report it -- so it does not belong in Glib.GFile.
# Pair the codes with Glib.Error.Get_Code.

ada = "Glib.Error_Enums"

[[extra.with_spec]]
pkg = "Glib.Error"

[[enum]]
ctype = "GBookmarkFileError"

[[enum]]
ctype = "GConvertError"
# Error codes returned by character set conversion routines.

[[enum]]
ctype = "GFileError"
# Error codes returned by file operations. Matches UNIX errno codes, available on Windows too.

[[enum]]
ctype = "GKeyFileError"

[[enum]]
ctype = "GMarkupError"

[[enum]]
ctype = "GNumberParserError"
# Error codes returned by functions converting a string to a number.

[[enum]]
ctype = "GOptionError"

[[enum]]
ctype = "GRegexError"

[[enum]]
ctype = "GResourceError"

[[enum]]
ctype = "GShellError"

[[enum]]
ctype = "GThreadError"

[[enum]]
ctype = "GUriError"

[[enum]]
ctype = "GVariantParseError"
# Error codes returned by parsing text-format GVariants.
