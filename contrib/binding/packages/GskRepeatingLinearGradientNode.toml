# ============================================================
#   GskRepeatingLinearGradientNode
# ============================================================

[[extra.with_spec]]
pkg = "Graphene.Rect"

[[extra.with_spec]]
pkg = "Graphene.Point"

[[method]]
id = "gsk_repeating_linear_gradient_node_new"
bind = false # manual binding

[[extra.spec]]
text = '''
   procedure Gtk_New
      (Self        : out Gsk_Repeating_Linear_Gradient_Node;
       Bounds      : not null access Graphene.Rect.Graphene_Rect_T;
       Start       : not null access Graphene.Point.Graphene_Point_T;
       The_End     : not null access Graphene.Point.Graphene_Point_T;
       Color_Stops : Gsk.Render_Node.Gsk_Color_Stop_Array);
   procedure Initialize
      (Self        : not null access Gsk_Repeating_Linear_Gradient_Node_Record'Class;
       Bounds      : not null access Graphene.Rect.Graphene_Rect_T;
       Start       : not null access Graphene.Point.Graphene_Point_T;
       The_End     : not null access Graphene.Point.Graphene_Point_T;
       Color_Stops : Gsk.Render_Node.Gsk_Color_Stop_Array);
   --  Creates a `GskRenderNode` that will create a repeating linear gradient
   --  from the given points and color stops, and render that into the area
   --  given by Bounds.
   --  Initialize does nothing if the object was already created with another
   --  call to Initialize* or G_New.
   --  @param Bounds the rectangle to render the linear gradient into
   --  @param Start the point at which the linear gradient will begin
   --  @param The_End the point at which the linear gradient will finish
   --  @param Color_Stops a pointer to an array of `GskColorStop` defining the
   --  gradient. The offsets of all color stops must be increasing. The first
   --  stop's offset must be >= 0 and the last stop's offset must be <= 1.

   function Gsk_Repeating_Linear_Gradient_Node_New
      (Bounds      : not null access Graphene.Rect.Graphene_Rect_T;
       Start       : not null access Graphene.Point.Graphene_Point_T;
       The_End     : not null access Graphene.Point.Graphene_Point_T;
       Color_Stops : Gsk.Render_Node.Gsk_Color_Stop_Array)
       return Gsk_Repeating_Linear_Gradient_Node;
   --  Creates a `GskRenderNode` that will create a repeating linear gradient
   --  from the given points and color stops, and render that into the area
   --  given by Bounds.
   --  @param Bounds the rectangle to render the linear gradient into
   --  @param Start the point at which the linear gradient will begin
   --  @param The_End the point at which the linear gradient will finish
   --  @param Color_Stops a pointer to an array of `GskColorStop` defining the
   --  gradient. The offsets of all color stops must be increasing. The first
   --  stop's offset must be >= 0 and the last stop's offset must be <= 1.
'''

[extra]
body = '''
   --------------------------------------------
   -- Gsk_Repeating_Linear_Gradient_Node_New --
   --------------------------------------------

   function Gsk_Repeating_Linear_Gradient_Node_New
      (Bounds      : not null access Graphene.Rect.Graphene_Rect_T;
       Start       : not null access Graphene.Point.Graphene_Point_T;
       The_End     : not null access Graphene.Point.Graphene_Point_T;
       Color_Stops : Gsk.Render_Node.Gsk_Color_Stop_Array)
       return Gsk_Repeating_Linear_Gradient_Node
   is
      Self : constant Gsk_Repeating_Linear_Gradient_Node := new Gsk_Repeating_Linear_Gradient_Node_Record;
   begin
      Gsk.Repeating_Linear_Gradient_Node.Initialize
        (Self, Bounds, Start, The_End, Color_Stops);
      return Self;
   end Gsk_Repeating_Linear_Gradient_Node_New;

   -------------
   -- Gtk_New --
   -------------

   procedure Gtk_New
      (Self        : out Gsk_Repeating_Linear_Gradient_Node;
       Bounds      : not null access Graphene.Rect.Graphene_Rect_T;
       Start       : not null access Graphene.Point.Graphene_Point_T;
       The_End     : not null access Graphene.Point.Graphene_Point_T;
       Color_Stops : Gsk.Render_Node.Gsk_Color_Stop_Array)
   is
   begin
      Self := new Gsk_Repeating_Linear_Gradient_Node_Record;
      Gsk.Repeating_Linear_Gradient_Node.Initialize
        (Self, Bounds, Start, The_End, Color_Stops);
   end Gtk_New;

   ----------------
   -- Initialize --
   ----------------

   procedure Initialize
      (Self        : not null access Gsk_Repeating_Linear_Gradient_Node_Record'Class;
       Bounds      : not null access Graphene.Rect.Graphene_Rect_T;
       Start       : not null access Graphene.Point.Graphene_Point_T;
       The_End     : not null access Graphene.Point.Graphene_Point_T;
       Color_Stops : Gsk.Render_Node.Gsk_Color_Stop_Array)
   is
      function Internal
         (Bounds        : access Graphene.Rect.Graphene_Rect_T;
          Start         : access Graphene.Point.Graphene_Point_T;
          The_End       : access Graphene.Point.Graphene_Point_T;
          Color_Stops   : System.Address;
          N_Color_Stops : Gsize) return System.Address;
      pragma Import (C, Internal, "gsk_repeating_linear_gradient_node_new");
   begin
      if not Self.Is_Created then
         Set_Object (Self, Internal (Bounds, Start, The_End, Color_Stops'Address, Gsize (Color_Stops'Length)));
      end if;
   end Initialize;
'''